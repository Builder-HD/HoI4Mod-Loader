name: Question or feature request
description: A question about using the loader or writing mods for it, or an idea for a new feature.
body:
  - type: markdown
    attributes:
      value: |
        Players: the [README](https://github.com/Builder-HD/HoI4Mod-Loader/blob/main/README.md) covers install, uninstall and game patches.
        Mod authors: [MODDING.md](https://github.com/Builder-HD/HoI4Mod-Loader/blob/main/MODDING.md) documents every script command.
        If something is broken, use the bug report form instead: it asks for the logs needed to look into it.
  - type: textarea
    id: question
    attributes:
      label: Question or request
    validations:
      required: true
