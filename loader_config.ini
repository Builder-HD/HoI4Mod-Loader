; hoi4_loader configuration. Place next to version.dll in the Hearts of Iron IV folder.
;
; Feature tiers:
;   file tier   - only serves virtual files (script detection, plugin flags). Runs on ANY hoi4.exe.
;   engine tier - hooks or patches code inside hoi4.exe. Runs only if the SHA-256 of hoi4.exe
;                 matches one of the values below.
; For any other build the loader keeps the file tier, disables the engine tier and prints the
; line to add here in loader.log.
; Format:  <label> = <sha256, hex, case-insensitive>

[supported_hashes]
; 1.19.3 (v1.19.3.0.c01a) as distributed by Steam (verified 2026-10-12).
1.19.3_vanilla = 7dc947be34970da1e1c787bcddbe7f62b610ff258aebf8f06aa8b348f3a031d5
; 1.19.3 after universal-checksum-patcher.exe (one byte differs from vanilla, see NOTES.md).
1.19.3_checksum_patched = 2d939e60d31aa15aeb70a9f6d4abd88b568b2f657990f0eeb9020e04f55221f8

[features]
; Every feature is on unless set to 0 here. Engine-tier features additionally need a supported
; hash above. Features: engine_probe, lifecycle, region_names (needs lifecycle),
; game_loaded, region_control, military_counts, army_condition, production_data (all need
; lifecycle).
; region_names = 0
; game_loaded = 0

[diagnostics]
; trigger_timing = 1 times every numeric data trigger evaluation and writes a summary to
; loader.log every 10 in-game days (evaluations, ns per evaluation, ms per in-game day).
; trigger_timing = 1
; production_lines = 1 logs the player country's production lines (class, factories, equipment
; names) on game entry, to check factories_assigned against the production screen.
; production_lines = 1
