; hoi4_loader configuration. Place next to version.dll in the Hearts of Iron IV folder.
;
; Feature tiers:
;   file tier   - only serves virtual files (script detection, plugin flags). Runs on ANY hoi4.exe.
;   engine tier - hooks or patches code inside hoi4.exe. Runs only if the SHA-256 of hoi4.exe
;                 matches one of the values below.
; For any other build the loader keeps the file tier, disables the engine tier and prints the
; line to add here in loader.log.
; Format:  <label> = <sha256, hex, case-insensitive>

[supported_hashes]
