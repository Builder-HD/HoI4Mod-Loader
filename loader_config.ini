[features]
; Every feature is on unless set to 0 here. Engine-tier features additionally need a supported
; hash above. Features: engine_probe, lifecycle, region_names (needs lifecycle),
; game_loaded, region_control, military_counts, army_condition, production_data, region_scope,
; create_army, railways, time_control, equipment_conversion (all need lifecycle), add_to_army
; (needs create_army), railway_queue (needs railways), air_scenarios.
; region_names = 0
; game_loaded = 0

[diagnostics]
; trigger_timing = 1 times every evaluation of a numeric data trigger, a scope block trigger
; (strategic_region) and any_strategic_region, and writes a summary to
; loader.log every 10 in-game days (evaluations, ns per evaluation, ms per in-game day).
; trigger_timing = 1
; production_lines = 1 logs the player country's production lines (class, factories, equipment
; names) on game entry, to check factories_assigned against the production screen.
; production_lines = 1
; signature_scan = 1 writes the read-only signature report (normally only written on a hoi4.exe
; build not listed above) on a listed build too: how many signatures, anchors and code shapes
; match. Nothing is hooked or patched for it.
; signature_scan = 1
