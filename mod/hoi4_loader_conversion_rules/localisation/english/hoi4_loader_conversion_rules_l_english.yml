l_english:
 RULE_GROUP_HOI4_LOADER_CONVERSION:0 "Equipment Conversion"
 RULE_HOI4_LOADER_CONVERSION_GENERATIONS:0 "Convert Earlier Generations"
 RULE_HOI4_LOADER_CONVERSION_GENERATIONS_DESC:0 "Whether §HConvert from Stockpile§! on a production line also takes equipment of earlier generations of the same equipment (for example Infantry Equipment I into Infantry Equipment II), not only the conversions the game defines."
 RULE_HOI4_LOADER_CONVERSION_GENERATIONS_ALLOWED_DESC:0 "Equipment of any earlier generation can be converted into the generation a line produces."
 RULE_HOI4_LOADER_CONVERSION_GENERATIONS_BLOCKED_DESC:0 "Only the conversions the game defines."
 RULE_HOI4_LOADER_CONVERSION_FACTOR:0 "Cost per Extra Generation"
 RULE_HOI4_LOADER_CONVERSION_FACTOR_DESC:0 "Converting from one generation back costs what the game charges. Each further generation back multiplies that by this factor."
 RULE_HOI4_LOADER_CONVERSION_FACTOR_100:0 "100%"
 RULE_HOI4_LOADER_CONVERSION_FACTOR_100_DESC:0 "Every earlier generation costs what the game charges."
 RULE_HOI4_LOADER_CONVERSION_FACTOR_90:0 "90%"
 RULE_HOI4_LOADER_CONVERSION_FACTOR_90_DESC:0 "Two generations back: 90% of the game's cost, three: 81%."
 RULE_HOI4_LOADER_CONVERSION_FACTOR_75:0 "75%"
 RULE_HOI4_LOADER_CONVERSION_FACTOR_75_DESC:0 "Two generations back: 75% of the game's cost, three: 56%."
 RULE_HOI4_LOADER_CONVERSION_FACTOR_50:0 "50%"
 RULE_HOI4_LOADER_CONVERSION_FACTOR_50_DESC:0 "Two generations back: 50% of the game's cost, three: 25%."
 RULE_HOI4_LOADER_CONVERSION_FACTOR_25:0 "25%"
 RULE_HOI4_LOADER_CONVERSION_FACTOR_25_DESC:0 "Two generations back: 25% of the game's cost, three: 6%."
 RULE_HOI4_LOADER_CONVERSION_EXISTING:0 "Conversions the Game Already Allows"
 RULE_HOI4_LOADER_CONVERSION_EXISTING_DESC:0 "Conversions the game or a mod defines between generations (for example older light tanks into light tank artillery): keep their cost, or apply the factor above to them too."
 RULE_HOI4_LOADER_CONVERSION_EXISTING_GAME_COST:0 "Game Cost"
 RULE_HOI4_LOADER_CONVERSION_EXISTING_GAME_COST_DESC:0 "They cost what the game charges."
 RULE_HOI4_LOADER_CONVERSION_EXISTING_LOADER_COST:0 "Factor Applies"
 RULE_HOI4_LOADER_CONVERSION_EXISTING_LOADER_COST_DESC:0 "Two or more generations back, they cost the game's cost times the factor above as well."
 RULE_HOI4_LOADER_CONVERSION_NAVAL:0 "Earlier Ship Hulls"
 RULE_HOI4_LOADER_CONVERSION_NAVAL_DESC:0 "Whether ships of an earlier hull generation can be refitted into a newer hull."
 RULE_HOI4_LOADER_CONVERSION_NAVAL_BLOCKED_DESC:0 "Ships refit only as the game allows."
 RULE_HOI4_LOADER_CONVERSION_NAVAL_ALLOWED_DESC:0 "Ships of any earlier hull generation can be refitted into a newer one."
 HOI4_LOADER_CONVERSION_MODE_ALL:0 "Sources: designs of §Hevery role§!. §HShift+click§!: the same role only."
 HOI4_LOADER_CONVERSION_MODE_ROLE:0 "Sources: designs of the §Hsame role§! only. §HShift+click§!: every role."
 HOI4_LOADER_CONVERSION_LEFT_OUT:0 "§gNot converted (another role):§!"
 HOI4_LOADER_CONVERSION_LEFT_OUT_ENTRY:0 "   §g$VARIANT$§!"
