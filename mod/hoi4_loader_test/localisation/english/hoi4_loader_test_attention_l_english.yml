l_english:
 hoi4_loader_attention_category:0 "Attention Areas"
 hoi4_loader_attention_category_desc:0 "Try out hoi4_loader's map outlines and camera focus."
 hoi4_loader_attention_chi_coast:0 "Mark China's Coast"
 hoi4_loader_attention_chi_coast_desc:0 "Outlines every coastal province China owns in cyan and moves the camera there."
 hoi4_loader_attention_swe_coast:0 "Mark Sweden's Coast"
 hoi4_loader_attention_swe_coast_desc:0 "Marks every coastal province Sweden controls: a pulsing orange outline over an orange band inside the edge."
 hoi4_loader_attention_ids:0 "Mark Gotland and Part of Hainan"
 hoi4_loader_attention_ids_desc:0 "Outlines the state of Gotland and two provinces of Hainan in red."
 hoi4_loader_attention_focus_chi:0 "Look at China's Coast"
 hoi4_loader_attention_clear:0 "Clear All Marks"
 hoi4_loader_attention_fill_translucent:0 "Fill Test: Red Wash"
 hoi4_loader_attention_fill_translucent_desc:0 "Washes Shandong in translucent red (fill = solid)."
 hoi4_loader_attention_fill_solid:0 "Fill Test: Red Glow"
 hoi4_loader_attention_fill_solid_desc:0 "A breathing red glow inside Shandong's edge (fill = glow) with a marching dashed line (line = dashed)."
 hoi4_loader_attention_stripes:0 "Stripes Test: Red Stripes"
 hoi4_loader_attention_stripes_desc:0 "Diagonal red stripes over Shandong, like occupation or area defense. Try other map modes too."
 hoi4_loader_attention_matrix:0 "Follow the White Rabbit"
 hoi4_loader_attention_matrix_desc:0 "Shandong dissolves into green digital rain, framed by marching ants. A mod-supplied shader pattern."
 hoi4_loader_attention_matrix_china:0 "Wake Up, Neo"
 hoi4_loader_attention_matrix_china_desc:0 "There is no China. All of it, in falling green code."
 hoi4_loader_attention_matrix_random:0 "Glitch in the Matrix"
 hoi4_loader_attention_matrix_country:0 "There Is No Spoon"
 hoi4_loader_attention_matrix_country_desc:0 "A random country dissolves into falling green code. No outline, just the rain. Take it again for another country."
 hoi4_loader_attention_fire_line:0 "Line of Fire"
 hoi4_loader_attention_fire_line_desc:0 "Some country's borders catch fire: a white-hot flickering line, the land behind it scorched and glowing. Take it again for another country."
 hoi4_loader_attention_dna:0 "Double Helix"
 hoi4_loader_attention_dna_desc:0 "Some country's border becomes a turning DNA double helix, cyan and magenta. Zoom in to watch it spin. Take it again for another country."
 hoi4_loader_attention_inferno:0 "Scorched Earth"
 hoi4_loader_attention_inferno_desc:0 "Twelve provinces of some unlucky country burst into flames, smoke and ruin. Take it again to pick another victim."
 hoi4_loader_attention_matrix_random_desc:0 "Déjà vu. A random state somewhere in the world turns into falling code, and the camera rushes there. Again. And again."
