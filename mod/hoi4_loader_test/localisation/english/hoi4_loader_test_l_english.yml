l_english:
 hoi4_loader_test.1.t:0 "HOI4 Loader Check"
 hoi4_loader_test.1.d_full:0 "§GLoader PRESENT.§!\n\nScripted trigger: replaced\nScripted effect: replaced\nLoader version: [?global.hoi4_loader_version|0]\nEngine tier (engine_probe): [GetHoi4LoaderEngineProbe]\nRegion names: [GetHoi4LoaderRegionNamesStatus]"
 hoi4_loader_test.1.d_trigger_only:0 "§YLoader PARTIAL.§!\n\nScripted trigger: replaced\nScripted effect: NOT replaced (global flag missing)\nLoader version: unknown\nEngine tier (engine_probe): [GetHoi4LoaderEngineProbe]"
 hoi4_loader_test.1.d_effect_only:0 "§YLoader PARTIAL.§!\n\nScripted trigger: NOT replaced\nScripted effect: replaced\nLoader version: [?global.hoi4_loader_version|0]\nEngine tier (engine_probe): [GetHoi4LoaderEngineProbe]"
 hoi4_loader_test.1.d_none:0 "§RLoader NOT present.§!\n\nScripted trigger: stub (always = no)\nScripted effect: stub\nEngine tier (engine_probe): [GetHoi4LoaderEngineProbe]\nSee Documents/Paradox Interactive/Hearts of Iron IV/loader.log"
 hoi4_loader_test_engine_active:0 "§Gactive§! (flag hoi4_loader_plugin_engine_probe set)"
 hoi4_loader_test_engine_inactive:0 "§Ydisabled§! (flag hoi4_loader_plugin_engine_probe not set)"
 hoi4_loader_test_region_names_active:0 "§Gactive§! (flag hoi4_loader_plugin_region_names set)"
 hoi4_loader_test_region_names_inactive:0 "§Ydisabled§! (flag hoi4_loader_plugin_region_names not set)"
 hoi4_loader_test.1.a:0 "OK"
 hoi4_loader_test.2.t:0 "Region Name Check"
 hoi4_loader_test.2.d:0 "Strategic region 42 (vanilla name: Bay of Biscay).\n\nName stored in the hoi4_srn flags: [GetHoi4LoaderRegion42FlagName]\nNative trigger strategic_region_has_custom_name: [GetHoi4LoaderRegion42HasCustomName]\nGuard hoi4_loader_feature_region_names: [GetHoi4LoaderRegionNamesGuard]\nPlugin flag (can be stale in a loaded save): [GetHoi4LoaderRegionNamesStatus]\n\nThe map, the region tooltip, naval and air mission screens should all show the same name. loader.log lists every change."
 hoi4_loader_test.2.a:0 "OK"
 hoi4_loader_test_yes:0 "§Gyes§!"
 hoi4_loader_test_no:0 "§Rno§!"
 hoi4_srn_test_guarded:0 "Region 42 has a custom name (guarded)"
 hoi4_srn_test_guarded_desc:0 "Visible only when the guard is yes and strategic_region_has_custom_name is true. Correct pattern."
 hoi4_srn_test_unguarded:0 "UNGUARDED: region 42 has a custom name"
 hoi4_srn_test_unguarded_desc:0 "Wrong pattern (plugin flag as guard). Without the loader this shows up when loading a save made with the loader."
 hoi4_srn_test_requires_custom:0 "Requires region 42 to have a custom name"
 hoi4_srn_test_requires_custom_desc:0 "Shows the native trigger's requirement line."
 hoi4_srn_test_requires_original:0 "Requires region 42 to have its original name"
 hoi4_srn_test_requires_original_desc:0 "Shows the negated requirement line."
 hoi4_loader_test_region_original:0 "Bay of Biscay (original name, no flag)"
 HOI4_LOADER_TEST_REGION_NAME_A:0 "Loader Test Sea A"
 HOI4_LOADER_TEST_REGION_NAME_B:0 "Loader Test Sea B"
 HOI4_LOADER_TEST_REGION_NAME_C:0 "Loader Test Sea C (flag protocol)"
 HOI4_LOADER_TEST-REGION-NAME-DASH:0 "Loader Test Sea Dash-Key"
 HOI4_LOADER_TEST_REGION_NAME_THAT_IS_DELIBERATELY_VERY_LONG_TO_CHECK_FLAG_NAME_LIMITS_IN_SAVE_AND_UI:0 "Loader Test Sea With A Deliberately Very Long Name To See How Labels And Tooltips Cope"
 hoi4_srn_test_dash:0 "Region 42: key with a dash"
 hoi4_srn_test_dash_desc:0 "Native effect with key HOI4_LOADER_TEST-REGION-NAME-DASH."
 hoi4_srn_test_long:0 "Region 42: very long key and name"
 hoi4_srn_test_long_desc:0 "Native effect with a 100-character key (112-character flag) and a long display name."
 hoi4_loader_test_category:0 "HOI4 Loader Tests"
 hoi4_loader_test_category_desc:0 "Test decisions for hoi4_loader plugins."
 hoi4_srn_test_rename_a:0 "Region 42: rename to A"
 hoi4_srn_test_rename_a_desc:0 "Native effect set_strategic_region_name: region 42, key HOI4_LOADER_TEST_REGION_NAME_A."
 hoi4_srn_test_rename_b:0 "Region 42: rename to B"
 hoi4_srn_test_rename_b_desc:0 "Native effect set_strategic_region_name: region 42, key HOI4_LOADER_TEST_REGION_NAME_B."
 hoi4_srn_test_reset:0 "Region 42: reset name"
 hoi4_srn_test_reset_desc:0 "Native effect reset_strategic_region_name: region 42."
 hoi4_srn_test_invalid_region:0 "Test: invalid region 9999"
 hoi4_srn_test_invalid_region_desc:0 "Must do nothing and write an error line to loader.log."
 hoi4_srn_test_missing_key:0 "Test: missing localisation key"
 hoi4_srn_test_missing_key_desc:0 "Must keep the current name and write an error line to loader.log."
 hoi4_srn_test_flag_protocol:0 "Region 42: rename to C via flags"
 hoi4_srn_test_flag_protocol_desc:0 "set_global_flag = hoi4_srn_42_HOI4_LOADER_TEST_REGION_NAME_C (no native effect)"
 hoi4_srn_test_show:0 "Show region 42 name status"
 hoi4_srn_test_show_desc:0 "Opens the region name check event."
 hoi4_loader_test.3.t:0 "Save Data Status"
 hoi4_loader_test.3.d:0 "Times on_game_loaded fired in this save: [?global.hoi4_loader_test_loads|0]\nData version of this save: [?global.hoi4_loader_test_mod_version|0] (current: 2)\nMigration: [GetHoi4LoaderTestMigration]\nDemo setting stored in: [GetHoi4LoaderTestDemoFlag]\nGuard hoi4_loader_feature_game_loaded (supported, not fired): [GetHoi4LoaderGameLoadedGuard]\n\nWhen on_game_loaded fires, this event opens right after loading and game.log has the line hoi4_loader_test: on_game_loaded fired."
 hoi4_loader_test.3.a:0 "OK"
 hoi4_loader_test.4.t:0 "Save Migrated"
 hoi4_loader_test.4.d:0 "This save was converted from data version 1 to 2.\n\nMigrated: [GetHoi4LoaderTestMigration]\nDemo setting now stored in: [GetHoi4LoaderTestDemoFlag]"
 hoi4_loader_test.4.a:0 "OK"
 hoi4_loader_test_migrated_by_load:0 "§Gdone, by on_game_loaded§!"
 hoi4_loader_test_migrated_by_weekly:0 "§Gdone, by the on_weekly fallback§!"
 hoi4_loader_test_migration_not_needed:0 "not needed (data already current)"
 hoi4_loader_test_migration_pending:0 "§Ypending (data version 1)§!"
 hoi4_loader_test_demo_new:0 "new flag (version 2 layout)"
 hoi4_loader_test_demo_old:0 "old flag (version 1 layout)"
 hoi4_loader_test_demo_none:0 "neither flag"
 hoi4_loader_test_make_old_save:0 "Save migration: make this an OLD save (data version 1)"
 hoi4_loader_test_make_old_save_desc:0 "Sets data version 1 and the old demo flag. Pause first, take it, then save right away."
 hoi4_loader_test_show_save_data:0 "Save migration: show save data status"
 hoi4_loader_test_show_save_data_desc:0 "Opens the save data status event."
 hoi4_loader_test.5.t:0 "Data Triggers as Variables"
 hoi4_loader_test.5.d:0 "Read with set_variable from the numeric triggers (country scope, ROOT = [ROOT.GetName]):\n\nAverage division strength: [?hoi4_loader_test_avg_strength|%1]\nAverage division organisation: [?hoi4_loader_test_avg_org|%1]\nFactories assigned to production: [?hoi4_loader_test_factories|0]\n\nCompare: the strength and organisation bars of your divisions, and the production screen's factory counts."
 hoi4_loader_test.5.a:0 "OK"
 hoi4_loader_data_category:0 "HOI4 Loader: Data Triggers"
 hoi4_loader_data_category_desc:0 "Numeric data triggers. Hover over the requirements of the status decisions to read the current values."
 hoi4_loader_ai_cost_category:0 "HOI4 Loader: AI Cost Probe"
 hoi4_loader_ai_cost_category_desc:0 "Evaluated by the AI for the timing measurement. Never taken."
 hoi4_loader_ai_cost_probe:0 "AI cost probe (never taken)"
 hoi4_loader_ai_cost_probe_desc:0 "Its AI weight uses every data trigger group; with trigger_timing = 1 loader.log reports the cost."
 hoi4_loader_data_threshold_low:0 "Data tests: thresholds LOW (25%, 1)"
 hoi4_loader_data_threshold_low_desc:0 "Sets global.hoi4_loader_test_threshold = 0.25 and global.hoi4_loader_test_count = 1."
 hoi4_loader_data_threshold_high:0 "Data tests: thresholds HIGH (75%, 10)"
 hoi4_loader_data_threshold_high_desc:0 "Sets global.hoi4_loader_test_threshold = 0.75 and global.hoi4_loader_test_count = 10."
 hoi4_loader_data_region_status:0 "Region control: status (hover)"
 hoi4_loader_data_region_status_desc:0 "Air superiority over Northern France (19) and the Bay of Biscay (42), naval dominance in the Bay of Biscay and the Channel (18). Compare with the region panels."
 hoi4_loader_data_air_above:0 "Air superiority over Northern France > 50%"
 hoi4_loader_data_air_above_desc:0 "air_superiority = ( region = 19 value > 0.5 )"
 hoi4_loader_data_air_below:0 "Air superiority over Northern France < 50%"
 hoi4_loader_data_air_below_desc:0 "air_superiority = ( region = 19 value < 0.5 )"
 hoi4_loader_data_air_equal:0 "Air superiority over Northern France = 50% (means above)"
 hoi4_loader_data_air_equal_desc:0 "air_superiority = ( region = 19 value = 0.5 ): for ratios = behaves like > (vanilla). Available exactly when the > 50% decision is."
 hoi4_loader_data_naval_var:0 "Naval dominance in Bay of Biscay > threshold variable"
 hoi4_loader_data_naval_var_desc:0 "naval_dominance = ( region = 42 value > global.hoi4_loader_test_threshold ). Switch the thresholds and watch it flip."
 hoi4_loader_data_missing_scope:0 "NOT air superiority without a region (caveat)"
 hoi4_loader_data_missing_scope_desc:0 "NOT = ( air_superiority > 0 ) outside a region scope: the trigger is false, so this is TRUE. loader.log notes the missing region once."
 hoi4_loader_data_military_status:0 "Military counts: status (hover)"
 hoi4_loader_data_military_status_desc:0 "Battles in Ile de France (state 16), Northern France (19) and involving France; divisions there (of France / at war with France); ships in the Bay of Biscay and the Channel; French planes based in Northern France."
 hoi4_loader_data_divisions_equal_zero:0 "Divisions in Ile de France = 0"
 hoi4_loader_data_divisions_equal_zero_desc:0 "divisions_count = ( state = 16 count = 0 ): for counts = means equal."
 hoi4_loader_data_divisions_below:0 "Divisions in Ile de France < 3"
 hoi4_loader_data_divisions_below_desc:0 "divisions_count = ( state = 16 count < 3 )"
 hoi4_loader_data_divisions_var:0 "French divisions in Ile de France > count variable"
 hoi4_loader_data_divisions_var_desc:0 "divisions_count = ( state = 16 owner = ROOT count > global.hoi4_loader_test_count )"
 hoi4_loader_data_planes_reserved:0 "Planes with a reserved parameter (parse error test)"
 hoi4_loader_data_planes_reserved_desc:0 "planes_count = ( region = 19 enemy_of = ROOT ... ): enemy_of is reserved for planes. loader.log reports it once; never available."
 hoi4_loader_data_battles_status:0 "Battles: located vs. fought from (hover)"
 hoi4_loader_data_battles_status_desc:0 "Battles in Western Germany (7) and Northern France (19): the default counts battles located there or fought by divisions standing there; location = only counts the located ones. Plus battles involving Germany."
 hoi4_loader_data_filters_status:0 "Unit filters: owner / enemy_of / allied_with (hover)"
 hoi4_loader_data_filters_status_desc:0 "Divisions in Western Germany of GER, at war with France, both; allied divisions and all divisions in Northern France; British ships in the North Sea (16); allied ships in the Channel (18); German planes based in Western Germany."
 hoi4_loader_data_state_scope:0 "State scope form: 16 = ( ... )"
 hoi4_loader_data_state_scope_desc:0 "Inside 16 = ( ... ): divisions_count = ( owner = ROOT count > 0 ), divisions_count > 0 and battles_count = ( count = 0 ) without a state parameter."
 hoi4_loader_data_planes_any:0 "Planes with owner = any (parse error test)"
 hoi4_loader_data_planes_any_desc:0 "planes_count = ( region = 19 owner = any ... ): planes need a country. loader.log reports it once; never available."
 hoi4_loader_data_army_status:0 "Army condition: status (hover)"
 hoi4_loader_data_army_status_desc:0 "Average strength and organisation of the whole army, and of the divisions in Ile de France (all / own)."
 hoi4_loader_data_army_var:0 "Average organisation > threshold variable"
 hoi4_loader_data_army_var_desc:0 "avg_division_organisation > global.hoi4_loader_test_threshold (value form in country scope)."
 hoi4_loader_data_production_status:0 "Production: status (hover)"
 hoi4_loader_data_production_status_desc:0 "Factories on all lines, on infantry equipment (archetype and type 1), on small airframes (fighters; 0 for France), dockyards on light hulls, and an unknown equipment name (always false)."
 hoi4_loader_data_production_var:0 "Factories on infantry equipment > count variable"
 hoi4_loader_data_production_var_desc:0 "factories_assigned = ( equipment = infantry_equipment count > global.hoi4_loader_test_count )"
 hoi4_loader_data_show_variables:0 "Data triggers as variables"
 hoi4_loader_data_show_variables_desc:0 "set_variable from avg_division_strength, avg_division_organisation and factories_assigned, then shows them."
 hoi4_loader_rs_identity:0 "Region scope: strategic_region and identity triggers (hover)"
 hoi4_loader_rs_identity_desc:0 "strategic_region = ( region = 19 ... ): id 19, a land region, holds state 16. Bay of Biscay (42): a sea region without state 16. Inside 16 = ( ... ) without region: the state's region is 19. Western Germany (7) is not a sea region."
 hoi4_loader_rs_data_inside:0 "Region scope: data triggers inside (hover)"
 hoi4_loader_rs_data_inside_desc:0 "Inside strategic_region = ( region = 19 ... ): air_superiority > 0, divisions_count > 0 and battles_count = ( count = 0 ), all without a region parameter."
 hoi4_loader_rs_any:0 "Region scope: any_strategic_region (hover)"
 hoi4_loader_rs_any_desc:0 "Some sea region; at least 98 sea regions but not 99 (vanilla wording, then with its own header); vanilla NOT any_state with a count for comparison; the Bay of Biscay with a custom tooltip; the region holding state 16 is 19."
 hoi4_loader_rs_any_tt:0 "The Bay of Biscay is one of them (custom tooltip)"
 hoi4_loader_rs_any_air:0 "Region scope: a sea region with our air superiority above 50 percent"
 hoi4_loader_rs_any_air_desc:0 "any_strategic_region = ( is_sea_region = yes air_superiority > 0.5 ). The cost case: trigger_timing logs any_strategic_region and air_superiority."
 hoi4_loader_rs_block_effect:0 "Region scope: rename the Bay of Biscay to A (strategic_region effect)"
 hoi4_loader_rs_block_effect_desc:0 "strategic_region = ( region = 42 set_strategic_region_name = ( name = ... ) set_variable = ( ... ) ). Ran: [?global.hoi4_loader_rs_effect_ran|0]"
 hoi4_loader_rs_every_air:0 "Region scope: count the sea regions with our air superiority above 50 percent"
 hoi4_loader_rs_every_air_desc:0 "every_strategic_region with limit = ( is_sea_region = yes air_superiority > 0.5 ) and display_individual_scopes = yes. Last count: [?global.hoi4_loader_rs_air_regions|0]"
 hoi4_loader_rs_every_amount:0 "Region scope: 3 random sea regions (random_select_amount)"
 hoi4_loader_rs_every_amount_desc:0 "every_strategic_region with limit = ( is_sea_region = yes ) and random_select_amount = 3. Last count: [?global.hoi4_loader_rs_amount|0]"
 hoi4_loader_rs_every_rename:0 "Region scope: rename the Bay of Biscay to B (every_strategic_region)"
 hoi4_loader_rs_every_rename_desc:0 "every_strategic_region = ( limit = ( strategic_region_id = 42 ) set_strategic_region_name = ( name = ... ) )."
 hoi4_loader_rs_random:0 "Region scope: rename one of North Sea, Channel, Bay of Biscay to C"
 hoi4_loader_rs_random_desc:0 "random_strategic_region with a limit on regions 16, 18 and 42; the tooltip names the pick."
 hoi4_loader_rs_random_prioritize:0 "Region scope: prioritize parse error (random_strategic_region)"
 hoi4_loader_rs_random_prioritize_desc:0 "prioritize is not supported (a parse error, logged once); the rest runs. Ran: [?global.hoi4_loader_rs_prioritize_ran|0]"
 hoi4_loader_rs_reset_names:0 "Region scope: reset all renamed regions"
 hoi4_loader_rs_reset_names_desc:0 "every_strategic_region = ( limit = ( strategic_region_has_custom_name = ( ) ) reset_strategic_region_name = ( ) )."
 hoi4_loader_ai_cost_region_probe:0 "AI cost probe: any_strategic_region (never taken)"
 hoi4_loader_ai_cost_region_probe_desc:0 "Every country evaluates any_strategic_region = ( is_sea_region = yes air_superiority > 0.5 ) for this decision's AI weight."
 hoi4_loader_rs_requires_tt:0 "Requires hoi4_loader (strategic region scopes)"
 hoi4_loader_rs_not_99_sea_tt:0 "Fewer than 99 sea regions"
 hoi4_loader_req.1.t:0 "hoi4_loader Features Missing"
 hoi4_loader_req.1.d:0 "The hoi4_loader test mod needs hoi4_loader (version.dll) with its region_scope and region_control features.\n\nRegion scopes: [GetHoi4LoaderReqRegionScope]\nRegion control data: [GetHoi4LoaderReqRegionControl]\n\nWithout them the decisions that use them are hidden. If you just updated the game, hoi4_loader may not support the new version yet: see loader.log."
 hoi4_loader_req.1.a:0 "Understood"
 hoi4_loader_req_yes:0 "§Gavailable§!"
 hoi4_loader_req_no:0 "§Rmissing§!"
 hoi4_loader_army_category:0 "HOI4 Loader: Armies"
 hoi4_loader_army_category_desc:0 "create_army tests. Play as Germany and take Prepare first. Hover a decision to see its create_army line."
 hoi4_loader_army_prepare:0 "Armies: prepare (generals and template)"
 hoi4_loader_army_prepare_desc:0 "Recruits Loader Test General A, General B, Marshal and Admiral, and adds the template Loader Test Infantry."
 hoi4_loader_army_a:0 "Armies: A (6 divisions at Frankfurt)"
 hoi4_loader_army_a_desc:0 "Loader Test Army A under General A."
 hoi4_loader_army_b:0 "Armies: B (30 divisions, spread)"
 hoi4_loader_army_b_desc:0 "An army over the 24-division soft cap under General B, spread over Brandenburg by create_unit itself."
 hoi4_loader_army_c:0 "Armies: C (two provinces, field marshal)"
 hoi4_loader_army_c_desc:0 "Loader Test Army C under the Marshal: two create_unit blocks, 3 divisions at each of two Brandenburg provinces."
 hoi4_loader_army_reassign:0 "Armies: reassign General A"
 hoi4_loader_army_reassign_desc:0 "Loader Test Army A2 (2 divisions) under General A with reassign = yes. Army A keeps its divisions without a general."
 hoi4_loader_army_fail_busy:0 "Armies: fail, general already leads an army"
 hoi4_loader_army_fail_unknown:0 "Armies: fail, unknown character"
 hoi4_loader_army_fail_unrecruited:0 "Armies: fail, character not recruited"
 hoi4_loader_army_fail_admiral:0 "Armies: fail, an admiral"
 hoi4_loader_army_fail_other_country:0 "Armies: fail, a French general"
 hoi4_loader_army_fail_army_group:0 "Armies: fail, marshal leads an army group"
 hoi4_loader_army_fail_no_divisions:0 "Armies: fail, create_unit creates nothing"
 hoi4_loader_army_fail_parse:0 "Armies: fail, a key that is not allowed inside"
 hoi4_loader_army_ai:0 "Armies: give Italy an army (AI test)"
 hoi4_loader_army_ai_desc:0 "Italy recruits Loader Test General AI and gets Loader Test AI Army, 10 divisions under that general."
 HLT_general_a:0 "Loader Test General A"
 HLT_general_b:0 "Loader Test General B"
 HLT_marshal:0 "Loader Test Marshal"
 HLT_admiral:0 "Loader Test Admiral"
 HLT_unrecruited:0 "Loader Test Unrecruited"
 HLT_general_ai:0 "Loader Test General AI"
